version: '3.3'

services:
  mysql:
    image: mysql:5
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_PORT=${DB_PORT_HOST}
    ports:
      - ${DB_PORT_HOST}:${CONTAINER_PORT_HOST}
    volumes:
      - "${MYSQL_VOLUME_HOST}:/var/lib/mysql"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - PMA_HOST=${CONTAINER_PMA_HOST}
    ports:
      - ${PMA_PORT_HOST}:${CONTAINER_PMA_PORT_HOST}

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${EMAIL_PGA}
      - PGADMIN_DEFAULT_PASSWORD=${PASSWORD_PGA}
    ports:
      - ${PGA_PORT_HOST}:${PGA_CONTAINER_PORT}
